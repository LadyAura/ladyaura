<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lady Aura Art | Cerrado</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      background: #100d17;
      color: #f8edf9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at top, rgba(178, 109, 255, 0.22), transparent 36rem),
        linear-gradient(135deg, #130f1d 0%, #201327 48%, #0f0d16 100%);
    }

    main {
      width: min(680px, 100%);
      text-align: center;
    }

    .brand {
      margin: 0 0 18px;
      font-size: clamp(2.2rem, 8vw, 4.6rem);
      font-weight: 400;
      line-height: 1.05;
    }

    .notice {
      margin: 0;
      font-size: clamp(1.25rem, 4vw, 2rem);
      line-height: 1.45;
      color: #ead9ef;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">Lady Aura Art</h1>
    <p class="notice">Cerrado por causas de fuerza mayor.</p>
  </main>
</body>
</html>
