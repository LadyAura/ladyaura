<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lady Aura Art | Pr&oacute;xima apertura</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      background: #0c0812;
      color: #fff7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 48px);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 220, 151, 0.22), transparent 12rem),
        radial-gradient(circle at 18% 28%, rgba(191, 120, 255, 0.22), transparent 18rem),
        radial-gradient(circle at 82% 72%, rgba(255, 132, 202, 0.16), transparent 20rem),
        linear-gradient(145deg, #0a0710 0%, #1c1027 48%, #0f0815 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 18px;
      pointer-events: none;
      border: 1px solid rgba(255, 226, 176, 0.14);
    }

    body::after {
      inset: 30px;
      border-color: rgba(246, 205, 255, 0.08);
    }

    main {
      position: relative;
      width: min(760px, 100%);
      text-align: center;
      padding: clamp(42px, 8vw, 78px) clamp(24px, 6vw, 68px);
      border: 1px solid rgba(255, 226, 176, 0.28);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025)),
        rgba(14, 9, 20, 0.72);
      box-shadow:
        0 28px 100px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
    }

    main::before,
    main::after {
      content: "\2726";
      position: absolute;
      top: 18px;
      color: rgba(255, 226, 176, 0.72);
      font-size: 1.15rem;
      line-height: 1;
    }

    main::before {
      left: 22px;
    }

    main::after {
      right: 22px;
    }

    .mark {
      width: 84px;
      height: 84px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 226, 176, 0.35);
      border-radius: 50%;
      color: #ffe3a5;
      font-size: 2.2rem;
      background:
        radial-gradient(circle, rgba(255, 226, 176, 0.18), transparent 62%),
        rgba(255, 255, 255, 0.035);
      box-shadow: 0 0 46px rgba(255, 206, 130, 0.18);
    }

    .brand {
      margin: 0;
      font-size: clamp(2.7rem, 9vw, 5.8rem);
      font-weight: 400;
      line-height: 0.95;
      color: #fff8fb;
      text-shadow: 0 0 34px rgba(255, 214, 247, 0.2);
    }

    .divider {
      width: min(320px, 70%);
      height: 1px;
      margin: 26px auto;
      background: linear-gradient(90deg, transparent, rgba(255, 226, 176, 0.72), transparent);
    }

    .season {
      display: inline-block;
      margin-bottom: 16px;
      color: #f9d88e;
      font-size: clamp(0.76rem, 2.5vw, 0.92rem);
      letter-spacing: 0.24em;
      line-height: 1.6;
      text-transform: uppercase;
    }

    .notice {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      line-height: 1.1;
      color: #fff1fb;
    }

    .message {
      max-width: 520px;
      margin: 20px auto 0;
      color: rgba(255, 247, 251, 0.72);
      font-size: clamp(1rem, 3vw, 1.18rem);
      line-height: 1.75;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">LA</div>
    <h1 class="brand">Lady Aura Art</h1>
    <div class="divider" aria-hidden="true"></div>
    <span class="season">Pr&oacute;xima apertura</span>
    <p class="notice">Verano de 2028</p>
    <p class="message">Estamos preparando una nueva etapa con calma, magia y mucho brillo.</p>
  </main>
</body>
</html>
